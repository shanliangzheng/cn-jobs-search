name: test

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        working-directory: .agents/skills/cn-jobs-search/cli
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Smoke test (offline demo)
        working-directory: .
        run: python .agents/skills/cn-jobs-search/cli/src/cli.py search -q llm -p demo -n 3
